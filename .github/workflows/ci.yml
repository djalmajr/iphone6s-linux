name: Public source checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Inspect staged public tree
        run: python iphone-linux-tools/scripts/ci/check-public.py
      - name: Install hash-pinned lint tools on runner
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r iphone-linux-tools/scripts/ci/requirements.txt
      - name: Python lint and shell syntax
        shell: bash
        run: |
          python -m flake8 --select E9,F63,F7,F82 iphone-linux-tools/scripts iphone-linux-tools/tests
          while IFS= read -r file; do bash -n "$file"; done < <(git ls-files '*.sh')
      - name: Synthetic tests without device or real identities
        run: python -m unittest discover -s iphone-linux-tools/tests -p 'test_*.py' -v
      - name: Profile security mutations
        run: python iphone-linux-tools/tests/run_profile_mutations.py
      - name: Reboot verification mutations
        run: python iphone-linux-tools/tests/run_return_ios_mutations.py
      - name: Source kernel integration mutations
        run: python iphone-linux-tools/tests/run_kernel_integration_mutations.py
      - name: ShellCheck on Linux runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          command -v shellcheck
          while IFS= read -r file; do shellcheck "$file"; done < <(git ls-files '*.sh')
