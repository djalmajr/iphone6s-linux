name: Public source checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-dns:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native Windows DNS parser, transport and source mutations
        shell: powershell
        run: |
          & ./iphone-linux-tools/tests/test_dns_windows.ps1 -RunMutations
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Inspect staged public tree
        run: python iphone-linux-tools/scripts/ci/check-public.py
      - name: Install hash-pinned lint tools on runner
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r iphone-linux-tools/scripts/ci/requirements.txt
      - name: Python lint and shell syntax
        shell: bash
        run: |
          python -m flake8 --select E9,F63,F7,F82 iphone-linux-tools/scripts iphone-linux-tools/tests
          while IFS= read -r file; do bash -n "$file"; done < <(git ls-files '*.sh')
      - name: Isolate expected native assertion crashes on hosted Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash iphone-linux-tools/scripts/ci/isolate-native-crashes.sh
      - name: Synthetic tests without device or real identities
        run: python -m unittest discover -s iphone-linux-tools/tests -p 'test_*.py' -v
      - name: Local snapshot and journal path mutations
        run: python iphone-linux-tools/tests/run_snapshot_path_mutations.py
      - name: Scheduler state path mutations
        run: python iphone-linux-tools/tests/run_autosnap_path_mutations.py
      - name: Host boot tool integrity mutations
        run: python iphone-linux-tools/tests/run_boot_tool_mutations.py
      - name: Composer output path mutations
        run: python iphone-linux-tools/tests/run_compose_mutations.py
      - name: DNS bundle path scope mutations
        run: python iphone-linux-tools/tests/run_dns_bundle_mutations.py
      - name: Unprivileged DNS socket activation mutations
        run: python iphone-linux-tools/tests/run_dns_activation_mutations.py
      - name: DNS mutation proof acceptance
        run: python iphone-linux-tools/tests/run_dns_mutation_gate_mutations.py
      - name: Restore mutation proof acceptance
        run: python iphone-linux-tools/tests/run_restore_mutation_gate_mutations.py
      - name: Herdr startup without nohup mutations
        run: python iphone-linux-tools/tests/run_herdr_detach_mutations.py
      - name: Live DNS deployment and rollback mutations
        run: python iphone-linux-tools/tests/run_dev_mutations.py
      - name: USB budget before gadget binding mutations
        run: python iphone-linux-tools/tests/run_usb_budget_mutations.py
      - name: Init-only USB budget image mutations
        run: python iphone-linux-tools/tests/run_usb_budget_image_mutations.py
      - name: Disabled N71 topology boundary mutations
        run: python iphone-linux-tools/tests/run_n71_topology_mutations.py
      - name: S8000 PCIe reference and bit preservation mutations
        run: python iphone-linux-tools/tests/run_n71_pcie_mutations.py
      - name: N71 read-only PCI inventory refusal and output integrity mutations
        run: python iphone-linux-tools/tests/run_n71_pcie_inventory_mutations.py
      - name: N71 ECAM function, bounds and byte extraction mutations
        run: python iphone-linux-tools/tests/run_n71_pcie_ecam_mutations.py
      - name: N71 PCI scan config writes, DMA refusal and verified restoration mutations
        run: python iphone-linux-tools/tests/run_n71_pcie_scan_mutations.py
      - name: N71 PCI scan physical result acceptance and cleanup mutations
        run: python iphone-linux-tools/tests/run_n71_scan_result_mutations.py
      - name: N71 HDQ reference threshold and frame mutations
        run: python iphone-linux-tools/tests/run_n71_hdq_mutations.py
      - name: N71 HDQ handshake ordering, timeout and cleanup obligations
        run: python iphone-linux-tools/tests/run_n71_hdq_handshake_mutations.py
      - name: N71 HDQ release mode, battery alert and event mask selection
        run: python iphone-linux-tools/tests/run_n71_hdq_release_plan_mutations.py
      - name: N71 HDQ GPIO2 mux scope and bit preservation
        run: python iphone-linux-tools/tests/run_n71_hdq_pinmux_mutations.py
      - name: N71 serdev stop bit registration, errors and TTY readback
        run: python iphone-linux-tools/tests/run_n71_serdev_stop_bits_mutations.py
      - name: N71 source bundle worktree boundaries and exact patch application
        run: python iphone-linux-tools/tests/run_kernel_bundle_mutations.py
      - name: N71 link identity, bus mastering and reset mutations
        run: python iphone-linux-tools/tests/run_n71_pcie_link_mutations.py
      - name: N71 REG_ON register scope and drive mode mutations
        run: python iphone-linux-tools/tests/run_n71_wlan_power_mutations.py
      - name: N71 REG_ON partial writes and verified restoration mutations
        run: python iphone-linux-tools/tests/run_n71_wlan_power_sequence_mutations.py
      - name: N71 I2C runtime PM usage, pending cleanup and verified detach
        run: python iphone-linux-tools/tests/run_n71_i2c_power_lifecycle_mutations.py
      - name: Profile security mutations
        run: python iphone-linux-tools/tests/run_profile_mutations.py
      - name: Reboot verification mutations
        run: python iphone-linux-tools/tests/run_return_ios_mutations.py
      - name: Source kernel integration mutations
        run: python iphone-linux-tools/tests/run_kernel_integration_mutations.py
      - name: N71 diagnostic payload selected ABI and exact DT boundary
        run: python iphone-linux-tools/tests/run_n71_diagnostic_payload_mutations.py
      - name: N71 physical session fresh latch and mandatory cleanup mutations
        run: python iphone-linux-tools/tests/run_n71_link_session_mutations.py
      - name: N71 external Wi-Fi build scope, ABI and preserved kernel mutations
        run: python iphone-linux-tools/tests/run_n71_wifi_modules_mutations.py
      - name: Kernel patchset source preservation and integrity mutations
        run: python iphone-linux-tools/tests/run_kernel_patchset_mutations.py
      - name: Pongo binary format mutations
        run: python iphone-linux-tools/tests/run_pongo_mutations.py
      - name: Pongo selection and USB boundary mutations
        run: python iphone-linux-tools/tests/run_pongo_selection_mutations.py
      - name: ShellCheck on Linux runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          command -v shellcheck
          while IFS= read -r file; do shellcheck "$file"; done < <(git ls-files '*.sh')
